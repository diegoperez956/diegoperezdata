function itemMetaHtml(item) {
  const fields = [];
  if (item.medium) fields.push(['medium', item.medium]);
  if (item.stack && item.stack.length) fields.push(['stack', item.stack]);
  if (item.what) fields.push(['what', item.what]);
  if (item.why) fields.push(['why', item.why]);
  const keyWidth = Math.max(...fields.map(f => f[0].length));
  const rows = fields.map(([k, v], i) => {
    const pad = ' '.repeat(keyWidth - k.length);
    const comma = i === fields.length - 1 ? '' : '<span class="punct">,</span>';
    let val;
    if (Array.isArray(v)) {
      val = `<span class="punct">[</span>${v.map(x => `<span class="str">"${escapeHtml(x)}"</span>`).join('<span class="punct">, </span>')}<span class="punct">]</span>`;
    } else {
      val = `<span class="str">"${escapeHtml(String(v))}"</span>`;
    }
    return `  <span class="key">"${k}"</span><span class="punct">:</span>${pad} ${val}${comma}`;
  }).join('\n');
  return `<pre class="proj-json"><span class="punct">{</span>\n${rows}\n<span class="punct">}</span></pre>`;
}

    return `
      <pre class="repo-tree">${escapeHtml(item.href.split('/').pop())}/\n${lines}</pre>
      <div class="pdf-actions"><a href="${item.href}" target="_blank" rel="noopener">view repo on github &rarr;</a></div>`;
  }
  if (item.type === 'iframe') return `<iframe src="${item.src}" title="${escapeHtml(item.title)}" loading="lazy" allowfullscreen></iframe>`;
  if (item.type === 'pdf') return `
    <a href="${item.src}" target="_blank" rel="noopener"><img class="pdf-thumb" src="${item.thumb}" alt="${escapeHtml(item.title)} preview" loading="lazy" decoding="async"/></a>
    <div class="pdf-actions">
      <a href="${item.src}" target="_blank" rel="noopener">open pdf &rarr;</a>
      <button type="button" class="secondary" data-load-pdf="${item.src}" data-title="${escapeHtml(item.title)}">view inline</button>
    </div>`;
  return `<img src="${encodeURI(item.src)}" alt="${escapeHtml(item.title)}" loading="lazy" decoding="async"/>`;
}

function wirePdfPreviews(root) {
  root.querySelectorAll('[data-load-pdf]').forEach(button => {
    button.addEventListener('click', () => {
      const src = button.dataset.loadPdf;
      const frame = button.closest('.focus-frame');
      frame.innerHTML = `
        <iframe src="${src}" title="${escapeHtml(button.dataset.title)}" loading="lazy"></iframe>
        <div class="pdf-actions"><a href="${src}" target="_blank" rel="noopener">open pdf in a new tab &rarr;</a></div>
      `;
      frame.querySelector('iframe').focus();
    });
  });
}

const itemLocked = { 'data-viz': null, 'graphic-design': null };
const subSortState = {
  'data-viz':       { col: null, dir: 1 },
  'graphic-design': { col: null, dir: 1 }
};

function renderCollection(section, focusId) {
  const items = section === 'data-viz' ? dataViz : graphicDesign;
  const dirLabel = section === 'data-viz' ? '/selected-work' : '/visual-studies';
  const dirDate = section === 'data-viz' ? '2026-07-03' : '2025-11-09';
  let active = focusId || itemLocked[section] || items[0].id;
  if (!items.some(x => x.id === active)) active = items[0].id;
  itemLocked[section] = active;

  const typeOf = d => d.type === 'iframe' ? 'dashboard' : d.type || 'image';
  const subArrow = (col) => {
    const s = subSortState[section];
    if (s.col !== col) return '';
    return s.dir === 1 ? ' ▲' : ' ▼';
  };
  const headerHtml = `<button type="button" class="name-cell" data-sub-sort="name">Name${subArrow('name')}</button><button type="button" class="type-cell" data-sub-sort="type">Type${subArrow('type')}</button><button type="button" class="date-cell" data-sub-sort="date">Updated${subArrow('date')}</button>`;

  const sorted = [...items];
  const s = subSortState[section];
  if (s.col) {
    const keyFn = s.col === 'name' ? (d => d.title.toLowerCase())
                : s.col === 'type' ? (d => typeOf(d))
                : (d => d.date || dirDate);
    sorted.sort((a, b) => {
      const av = keyFn(a), bv = keyFn(b);
      return av < bv ? -s.dir : av > bv ? s.dir : 0;
    });
  }

  const rowSpans = sorted.map(d => {
    const typeLabel = typeOf(d);
    const date = d.date || dirDate;
    const cls = d.id === active ? 'row sub-row active' : 'row sub-row';
    return `<a class="${cls}" data-item="${d.id}" href="${hashFor(section, d.id)}"><span class="name-cell">${escapeHtml(d.title)}</span><span class="type-cell">${typeLabel}</span><span class="date-cell">${date}</span></a>`;
  }).join('');

  const item = items.find(x => x.id === active);
  pane.innerHTML = `
    <h2 class="section-title">Index of ${dirLabel}</h2>
    <p class="meta">${items.length} entries &middot; last-modified: ${dirDate}</p>
    <div class="split">
      <div class="sub-list">
        <div class="listing"><span class="headers">${headerHtml}</span></div>
        <hr/>
        <div class="listing sub-rows">${rowSpans}</div>
      </div>
      <div class="sub-focus">
        <h3 style="margin-top:0">${escapeHtml(item.title)}</h3>
        ${itemMetaHtml(item)}
        <div class="focus-frame">${itemFrameHtml(item)}</div>
      </div>
    </div>
  `;

  const focusEl = pane.querySelector('.sub-focus');
  const listEl = pane.querySelector('.sub-list');
  let subLocked = active;
  let shown = active;
  wirePdfPreviews(focusEl);

  function paintFocus(id) {
    if (id === shown) return;
    const it = items.find(x => x.id === id);
    if (!it) return;
    shown = id;
    focusEl.innerHTML = `<h3 style="margin-top:0">${escapeHtml(it.title)}</h3>${itemMetaHtml(it)}<div class="focus-frame">${itemFrameHtml(it)}</div>`;
    wirePdfPreviews(focusEl);
    listEl.querySelectorAll('.sub-row').forEach(r => r.classList.toggle('active', r.dataset.item === id));
  }

  listEl.querySelectorAll('.sub-row').forEach(row => {
    if (canHover) row.addEventListener('mouseenter', () => paintFocus(row.dataset.item));
    row.addEventListener('click', (e) => {
      if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      e.preventDefault();
      subLocked = row.dataset.item;
      itemLocked[section] = subLocked;
      paintFocus(subLocked);
      const h = hashFor(section, subLocked);
      if (location.hash !== h) history.replaceState(null, '', h);
    });
  });
  listEl.querySelectorAll('[data-sub-sort]').forEach(button => {
    button.addEventListener('click', () => {
      const col = button.dataset.subSort;
      const st = subSortState[section];
      if (st.col === col) st.dir = -st.dir;
      else { st.col = col; st.dir = 1; }
      renderCollection(section, itemLocked[section]);
      pane.querySelector(`[data-sub-sort="${col}"]`).focus();
    });
  });
  if (canHover) listEl.addEventListener('mouseleave', () => paintFocus(subLocked));
}

function highlightActive(section) {
  document.querySelectorAll('#rows .row').forEach(r => {
    r.classList.toggle('active', r.dataset.section === section);
  });
}

let locked = null;

const sectionSlug = { 'data-viz': 'selected-work', 'graphic-design': 'visual-studies', 'about': 'about', 'contact': 'contact' };
const slugSection = { 'selected-work': 'data-viz', 'visual-studies': 'graphic-design', 'about': 'about', 'contact': 'contact' };

function hashFor(section, itemId) {
  if (section === 'home') return '#/';
  if (section.startsWith('user:')) return '#/' + encodeURIComponent(section.slice(5));
  return '#/' + sectionSlug[section] + (itemId ? '/' + itemId : '');
}

function applyHash() {
  let raw = location.hash.replace(/^#\/?/, '');
  try { raw = decodeURIComponent(raw); } catch (e) {}
  const parts = raw.split('/');
  const slug = parts[0] || '';
  let section = 'home';
  if (Object.hasOwn(slugSection, slug)) section = slugSection[slug];
  else if (userDirs.some(d => d.name === slug)) section = 'user:' + slug;
  locked = section === 'home' ? null : section;
  const item = parts[1];
  if (item && itemLocked[section] !== undefined) itemLocked[section] = item;
  render(section, item);
}

function goTo(section, itemId) {
  const h = hashFor(section, itemId);
  if (location.hash === h) applyHash();
  else location.hash = h;
}
window.addEventListener('hashchange', applyHash);

function wireRow(row) {
  const section = row.dataset.section;
  if (!section) return;
  if (canHover) {
    row.addEventListener('mouseenter', () => {
      if (!locked) render(section);
    });
  }
  row.addEventListener('click', (e) => {
    if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    e.preventDefault();
    goTo(section);
  });
}

const fileRows = [
  { name: 'selected-work/',  type: 'directory', date: '2026-07-03', section: 'data-viz' },
  { name: 'visual-studies/', type: 'directory', date: '2025-11-09', section: 'graphic-design' },
  { name: 'about',           type: 'file',      date: '2026-07-03', section: 'about' },
  { name: 'contact',         type: 'file',      date: '2026-07-03', section: 'contact' },
  { name: 'github.url',      type: 'link',      date: '2026-05-10', href: 'https://github.com/diegoperez956' },
  { name: 'linkedin.url',    type: 'link',      date: '2025-09-14', href: 'https://www.linkedin.com/in/diegoperez956/' },
  { name: 'resume.pdf',      type: 'file',      date: '2026-07-03', href: '/Diego_Perez_Resume.pdf' }
];

const userDirs = (() => {
  try {
    const v = JSON.parse(localStorage.getItem('userDirs') || '[]');
    return Array.isArray(v) ? v.filter(d => d && typeof d.name === 'string'
      && /^[a-zA-Z0-9_-]{1,40}$/.test(d.name) && !Object.hasOwn(slugSection, d.name)
      && typeof d.date === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(d.date)) : [];
  } catch (e) { return []; }
})();

function saveUserDirs() {
  try { localStorage.setItem('userDirs', JSON.stringify(userDirs)); } catch (e) {}
}

const NAME_W = 17, TYPE_W = 12;
const sortState = { col: null, dir: 1 };

function rowHtml(r) {
  const nameGap = ' '.repeat(Math.max(1, NAME_W - r.name.length));
  const typeCell = r.type.padEnd(TYPE_W);
  const dateCell = r.date || '-';
  if (r.section) {
    return `<span class="row" data-section="${r.section}"><a data-section="${r.section}" href="${hashFor(r.section)}">${escapeHtml(r.name)}</a>${nameGap}${typeCell}${dateCell}</span>`;
  }
  const ext = r.href.startsWith('http');
  const attrs = ext ? ' target="_blank" rel="noopener"' : '';
  const mark = ext ? '<span class="ext"> &rarr;</span>' : '';
  return `<span class="row"><a href="${r.href}"${attrs}>${escapeHtml(r.name)}</a>${nameGap}${typeCell}${dateCell}${mark}</span>`;
}

function sortedRows() {
  const parent = { name: '../', type: 'parent', date: null, section: 'home' };
  const userRows = userDirs.map(d => ({ name: d.name + '/', type: 'directory', date: d.date, section: 'user:' + d.name }));
  let rest = [...fileRows, ...userRows];
  if (sortState.col) {
    const key = sortState.col;
    rest.sort((a, b) => {
      let av = a[key] || '', bv = b[key] || '';
      if (key === 'date') { av = av || '0000-00-00'; bv = bv || '0000-00-00'; }
      return av < bv ? -sortState.dir : av > bv ? sortState.dir : 0;
    });
  } else {
    const isDir = r => r.type === 'directory';
    rest.sort((a, b) => (isDir(b) - isDir(a)) || a.name.localeCompare(b.name));
  }
  return [parent, ...rest];
}

function renderRows() {
  const rowsEl = document.getElementById('rows');
  rowsEl.innerHTML = sortedRows().map(rowHtml).join('\n');
  rowsEl.querySelectorAll('.row[data-section]').forEach(wireRow);
  highlightActive(locked || 'home');
}

function arrow(col) {
  if (sortState.col !== col) return '';
  return sortState.dir === 1 ? ' ▲' : ' ▼';
}

function renderHeaders() {
  const headersEl = document.getElementById('headers');
  const namePad = ' '.repeat(Math.max(1, NAME_W - ('Name'.length + arrow('name').length)));
  const typePad = ' '.repeat(Math.max(1, TYPE_W - ('Type'.length + arrow('type').length)));
  headersEl.innerHTML = `<span class="headers"><button type="button" data-sort="name">Name${arrow('name')}</button>${namePad}<button type="button" data-sort="type">Type${arrow('type')}</button>${typePad}<button type="button" data-sort="date">Updated${arrow('date')}</button></span>`;
  headersEl.querySelectorAll('[data-sort]').forEach(button => {
    button.addEventListener('click', () => {
      const col = button.dataset.sort;
      if (sortState.col === col) sortState.dir = -sortState.dir;
      else { sortState.col = col; sortState.dir = 1; }
      renderHeaders();
      renderRows();
      headersEl.querySelector(`[data-sort="${col}"]`).focus();
    });
  });
}

renderHeaders();
renderRows();

if (canHover) {
  document.querySelector('#rows').addEventListener('mouseleave', () => {
    if (!locked) render('home');
  });
} else {
  document.querySelector('.hint').textContent = '# tap to open. ../ returns home.';
}

document.getElementById('mkdir-form').addEventListener('submit', (e) => {
  e.preventDefault();
  const input = document.getElementById('mkdir-input');
  const raw = input.value.trim().replace(/[^a-zA-Z0-9_\-]/g, '-').slice(0, 40);
  if (!raw || Object.hasOwn(slugSection, raw)) return;
  if (userDirs.some(d => d.name === raw)) { input.value = ''; return; }
  const today = new Date().toISOString().slice(0,10);
  userDirs.push({ name: raw, date: today });
  saveUserDirs();
  input.value = '';
  renderRows();
});

applyHash();
</script>

</body>
</html>
